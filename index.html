<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGA Explorer</title><style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#f4f6fa;color:#1c2a40;margin:0}main{max-width:1050px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}p,small{color:#64748b}nav{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #d4ddeb;border-radius:10px;padding:10px 14px;background:white;color:inherit}button{cursor:pointer}button:hover,button.active{background:#e8f0ff;border-color:#5c86c4}button:focus-visible{outline:3px solid #5c86c4}.panel{background:white;border:1px solid #dbe3ee;border-radius:16px;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{text-align:left;min-height:100px}.tile strong{display:block;margin-bottom:8px}.tag{font-size:12px;color:#53677f}.center{text-align:center;background:#f1f5fb;border-radius:12px;padding:22px;margin:18px auto;max-width:420px}.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.layer{border-top:5px solid #5385c7;background:#f5f7fb;border-radius:10px;padding:16px;text-align:center}.layer:nth-child(2){border-color:#d49b45}.layer:nth-child(3){border-color:#9877c5}.cap{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;border-bottom:1px solid #edf0f4;padding:13px 0}.cap-description{margin-top:5px;font-size:12px;line-height:1.4;color:#64748b}.cap>div:first-child{flex:1;min-width:0}.cap>span:last-child{flex-shrink:0;white-space:nowrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.existing{background:#23856b}.in_development{background:#b9812f}.conceptual{background:#8c74ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.controls input{width:290px;max-width:100%}footer{margin:20px 0;font-size:12px;color:#64748b}@media(max-width:550px){.layers{grid-template-columns:1fr}}
</style></head><body><main><header><h1>SIGA · Architecture Explorer</h1><small>Knowledge Model · Public prototype v0.1</small></header><nav id="tabs"></nav><section class="panel" id="view">Loading…</section><footer id="footer"></footer></main><script>
let model,level=1,selected=null,selectedLayer=null,status='all';const view=document.getElementById('view');const E=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};function B(text,fn,cls){const n=E('button',text,cls);n.onclick=fn;return n}function add(p,...c){c.forEach(x=>p.append(x));return p}function render(){const tabs=document.getElementById('tabs');tabs.replaceChildren();['Ecosystem','Domains','Capabilities'].forEach((t,i)=>tabs.append(B((i+1)+' · '+t,()=>{level=i+1;selected=null;selectedLayer=null;render()},level===i+1?'active':'')));view.replaceChildren();if(level===1){add(view,E('h2','SIGA Ecosystem'),E('div','SIGA · Smart Integrated Guest & Asset Management','center'),E('p','↓'));const grid=E('div',undefined,'layers');model.layers.forEach(l=>{const b=B(l.name+' ('+model.domains.filter(d=>d.layer===l.id).length+' domains)',()=>{selectedLayer=l.id;selected=null;level=2;render()},'layer');grid.append(b)});add(view,grid,E('p','Knows → Understands → Recommends → Acts → Learns'));return}const crumb=E('div',undefined,'tag');const layer=model.layers.find(l=>l.id===selectedLayer);const domain=model.domains.find(d=>d.id===selected);crumb.textContent='SIGA'+(layer?' → '+layer.name:' → All systems')+(level===3&&domain?' → '+domain.name:'');view.append(crumb);const controls=E('div',undefined,'controls');let search=null;
if(level===2){
 const systemFilter=E('select');systemFilter.setAttribute('aria-label','Filter by system');
 [['','All systems'],...model.layers.map(l=>[l.id,l.name])].forEach(([v,t])=>{const o=E('option',t);o.value=v;systemFilter.append(o)});
 systemFilter.value=selectedLayer||'';systemFilter.onchange=()=>{selectedLayer=systemFilter.value||null;render()};controls.append(systemFilter)
}else{
 const domainFilter=E('select');domainFilter.setAttribute('aria-label','Filter by domain');
 [['','All Domains'],...model.domains.map(d=>[d.id,d.name])].forEach(([v,t])=>{const o=E('option',t);o.value=v;domainFilter.append(o)});
 domainFilter.value=selected||'';domainFilter.onchange=()=>{selected=domainFilter.value||null;selectedLayer=selected?model.domains.find(d=>d.id===selected).layer:null;render()};controls.append(domainFilter);
 search=E('input');search.placeholder='Search capabilities';search.setAttribute('aria-label','Search capabilities');controls.append(search);
 const filter=E('select');filter.setAttribute('aria-label','Filter maturity');
 [['all','All statuses'],['existing','Existing'],['in_development','In development'],['conceptual','Conceptual']].forEach(([v,t])=>{const o=E('option',t);o.value=v;filter.append(o)});
 filter.value=status;filter.onchange=()=>{status=filter.value;show()};controls.append(filter)
}
view.append(controls);const body=E('div');view.append(body);if(search)search.oninput=show;function show(){body.replaceChildren();const q=search?search.value.toLowerCase():'';if(level===2){const grid=E('div',undefined,'grid');model.domains.filter(d=>!selectedLayer||d.layer===selectedLayer).forEach(d=>grid.append(B(d.name+' · '+d.capabilities.length+' capabilities',()=>{selected=d.id;selectedLayer=d.layer;level=3;render()},'tile')));body.append(grid);return}
const domains=selected?model.domains.filter(d=>d.id===selected):model.domains;
let count=0;
domains.forEach(d=>{
 const matches=d.capabilities.filter(c=>(status==='all'||c.status===status)&&(c.name+' '+(c.description||'')).toLowerCase().includes(q));
 if(!matches.length)return;
 count+=matches.length;body.append(E('h2',d.name));
 matches.forEach(c=>{const row=E('div',undefined,'cap');const detail=E('div');add(detail,E('strong',c.name));if(c.description)add(detail,E('div',c.description,'cap-description'));row.append(detail);const st=E('span');add(st,E('span',undefined,'dot '+c.status),E('small',c.status.replace('_',' ')));row.append(st);body.append(row)})
});
if(!count)body.append(E('p','No capabilities match the selected filters.'));
}show()}
fetch('./siga-map.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{model=d;document.getElementById('footer').textContent=d.status_note;render()}).catch(e=>{view.textContent='Unable to load siga-map.json: '+e.message});
</script></body></html>
